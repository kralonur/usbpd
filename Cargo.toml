[workspace]
resolver = "3"
members = ["usbpd", "usbpd-traits"]
exclude = ["examples"]

[workspace.package]
authors = ["Adrian Figueroa <elagil@takanome.de>"]
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/elagil/usbpd"
license = "MIT"

exclude = ["/.gitignore", "/.github/"]

[workspace.dependencies]
usbpd-traits = { version = "2.0.0", path = "./usbpd-traits" }
proc-bitfield = "0.5.3"
byteorder = { version = "1.5.0", default-features = false }
heapless = "0.9.3"
uom = { version = "0.38.0", default-features = false }
embassy-futures = "0.1.2"


thiserror = { version = "2.0.21", default-features = false }
defmt = "1.1.1"
log = "0.4.34"
serde = { version = "1.0.229", default-features = false }

tokio = "1.53.2"
